services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pepsa_admin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5433:5432']
    volumes: ['pepsa_admin_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pepsa_admin']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ['3300:3300']
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pepsa_admin_data:
