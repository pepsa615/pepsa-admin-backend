upstream pepsa_admin_api {
    server 127.0.0.1:3300;
    keepalive 32;
}

server {
    listen 80;
    server_name admin-api.pepsa.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin-api.pepsa.co;

    ssl_certificate /etc/letsencrypt/live/admin-api.pepsa.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-api.pepsa.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 5m;

    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://pepsa_admin_api;
        proxy_set_header Authorization "Bearer __PEPSA_ADMIN_METRICS_TOKEN__";
    }

    location / {
        proxy_pass http://pepsa_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
